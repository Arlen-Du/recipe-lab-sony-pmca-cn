name: create-release

# The whole release runbook as one button. There is one branch: semantic-release reads the
# commits on `main`, decides the version, writes the manifest via tools/bump-version.sh,
# builds the APK, tags, publishes and commits the bump back. Then the rolling `dev`
# prerelease is rebuilt so its tag follows the new tip of `main`.
#
# Run it from the Actions tab, or:
#   gh workflow run create-release.yml                  release
#   gh workflow run create-release.yml -f dry_run=true  report only, change nothing

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report the version that would be released, change nothing'
        required: false
        type: boolean
        default: false
      allow_failing_checks:
        description: 'Release even if the last build failed'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  # What would ship, and is main in a state worth shipping? Nothing is pushed here.
  preview:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      releasable: ${{ steps.next.outputs.releasable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # A green build -- unit tests included -- is the gate CI can give. Nothing about
      # recipes or the settings store can be proven without a camera.
      - name: Did the last build pass?
        if: ${{ !inputs.allow_failing_checks }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          C="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow dev-build.yml \
                 --branch main --limit 1 --json conclusion --jq '.[0].conclusion // "none"')"
          case "$C" in
            success) echo "last build: success" ;;
            none)    echo "::warning::no build found — continuing" ;;
            *)       echo "::error::last build concluded '$C'. Re-run it, or dispatch again with allow_failing_checks."; exit 1 ;;
          esac

      - name: What would semantic-release publish?
        id: next
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # See the release job below: GITHUB_REF is the dispatch ref, and semantic-release
          # takes the current branch from it. This job always reports on main.
          export GITHUB_REF=refs/heads/main
          OUT="$(npx semantic-release --dry-run 2>&1 || true)"
          echo "$OUT" | grep -viE 'Loaded plugin' | tail -40
          V="$(printf '%s' "$OUT" | sed -n 's/.*next release version is \([0-9][0-9.]*\).*/\1/p' | tail -1)"
          if [ -n "$V" ]; then
            echo "version=$V"     >> "$GITHUB_OUTPUT"
            echo "releasable=true" >> "$GITHUB_OUTPUT"
            echo "## Would release $V" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "releasable=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Nothing to release"
              echo
              echo "No commit since the last tag carries a releasable type. Remember that a"
              echo "squash merge leaves only the PR title, so a PR titled \`chore:\` contributes"
              echo "nothing releasable even if its diff does."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # semantic-release owns everything from here: version, manifest, build, tag, publish.
  release:
    needs: preview
    if: ${{ !inputs.dry_run && needs.preview.outputs.releasable == 'true' }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          submodules: true
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install the SDK packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "build-tools;30.0.3" "platforms;android-28" "ndk;16.1.4479499"

      # Before anything is published: a release never ships what the tests reject.
      - name: Run the unit tests
        run: ./tools/test.sh

      # Decides the version from the commits, writes the manifest via tools/bump-version.sh,
      # builds the APK, tags main's tip, publishes the release and commits the bump back.
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_SDK="$ANDROID_SDK_ROOT"
          export ANDROID_NDK="$ANDROID_SDK_ROOT/ndk/16.1.4479499"
          # semantic-release reads the current branch from GITHUB_REF -- the ref the run was
          # dispatched on, not the one checked out. Dispatched from a work branch it would
          # find itself on a branch .releaserc.js does not publish from and no-op. This job
          # only ever releases main, so say so.
          #
          # It has to be an export here, not an env: entry on the step: the runner reserves
          # the GITHUB_ prefix and injects its own value over anything env: sets. Exporting
          # inside the step's shell happens after that, so npx inherits this one. --no-ci
          # does not help either; env-ci still detects Actions from GITHUB_ACTIONS.
          export GITHUB_REF=refs/heads/main
          npx semantic-release

  # semantic-release pushes the release commit with GITHUB_TOKEN, which does not start a
  # workflow run, so dev-build's push trigger never fires for it. Call it, or the rolling
  # `dev` prerelease keeps pointing at the commit before the release.
  refresh-dev-prerelease:
    needs: release
    uses: ./.github/workflows/dev-build.yml
    secrets: inherit
